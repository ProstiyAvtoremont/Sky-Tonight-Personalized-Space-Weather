name: Daily content refresh

# Fetches NASA's Astronomy Picture of the Day once a day, translates it,
# and commits the result — so the live site never has to call the NASA API
# itself. Also runnable manually from the Actions tab.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily — adjust to taste
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch and translate APOD
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/fetch-apod.js

      - name: Commit updated content
        run: |
          git config user.name "galaxyspace-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/apod.json
          git diff --cached --quiet || git commit -m "chore: daily APOD refresh [skip ci]"
          git push
